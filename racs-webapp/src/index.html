<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>RACS</title>
  <base href="/">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0e10">
  <!-- The theme before the first paint (ThemeService takes over); same key and default as there. -->
  <script>
    (function () {
      var t = 'technical-dark';
      try {
        var p = localStorage.getItem('racs.theme');
        if (p === 'technical-dark' || p === 'technical-light' || p === 'light') {
          t = p;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          t = 'technical-light';
        }
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>
  <app-root></app-root>
</body>

</html>
