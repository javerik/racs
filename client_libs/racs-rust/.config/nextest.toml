# `cargo nextest run --profile ci` (GitLab CI): runs every test and writes a JUnit report
# to target/nextest/ci/junit.xml for the job's `reports: junit`.
[profile.ci]
fail-fast = false

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# tests/fake_server.rs shares one fake server and serializes on a static Mutex, which only
# works within one process; nextest runs each test in its own, so run them one at a time.
[test-groups]
fake-server = { max-threads = 1 }

[[profile.default.overrides]]
filter = "binary(fake_server)"
test-group = "fake-server"
